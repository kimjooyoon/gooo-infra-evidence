name: Infrastructure deployment contract packet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-contract-packet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCK: contracts/deployment-contract-packet-release-lock-v1.json
      DENOMINATOR: contracts/deployment-contract-packet-denominator-v1.json
      REQUEST: fixtures/checkout-service/deployment-review-request.json
      SOURCE: examples/deployment-contract-packet/main.gooo
      GENERATOR: scripts/generate-deployment-contract-packet.sh
      EVALUATOR: scripts/evaluate-deployment-contract-packet.sh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'

      - name: Observe Go 1.27 and fix only module roots
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          module_roots=0
          while IFS= read -r -d '' module; do
            module_roots=$((module_roots+1))
            (cd "$(dirname "$module")" && go fix ./...)
          done < <(find . -type f -name go.mod -not -path './.git/*' -print0)
          jq -S -n --arg go_version "$(go env GOVERSION)" --argjson module_roots "$module_roots" \
            '{schema:"gooo/infra-evidence/deployment-packet-go-fix/v1",go_version:$go_version,
              module_roots:$module_roots,go_fix_targets:$module_roots}' > "$RUNNER_TEMP/go-fix-observation.json"

      - name: Download three immutable releases
        shell: bash
        run: |
          set -euo pipefail
          for key in core infra_evidence claim_adoption; do
            repository=$(jq -r --arg key "$key" '.[$key].repository' "$LOCK")
            tag=$(jq -r --arg key "$key" '.[$key].tag' "$LOCK")
            target=$(jq -r --arg key "$key" '.[$key].target_commit_sha' "$LOCK")
            release_id=$(jq -r --arg key "$key" '.[$key].release_id' "$LOCK")
            ref=$(gh api "repos/$repository/git/ref/tags/$tag")
            release=$(gh api "repos/$repository/releases/tags/$tag")
            jq -e --arg target "$target" '.object.type=="commit" and .object.sha==$target' <<<"$ref" >/dev/null
            jq -e --arg target "$target" --argjson release_id "$release_id" \
              '.id==$release_id and .target_commitish==$target and .draft==false and .prerelease==true' <<<"$release" >/dev/null
            asset_id=$(jq -r --arg key "$key" '.[$key].asset.id' "$LOCK")
            asset_name=$(jq -r --arg key "$key" '.[$key].asset.name' "$LOCK")
            asset_size=$(jq -r --arg key "$key" '.[$key].asset.size' "$LOCK")
            asset_digest=$(jq -r --arg key "$key" '.[$key].asset.digest' "$LOCK")
            jq -e --arg name "$asset_name" --arg digest "$asset_digest" --argjson id "$asset_id" --argjson size "$asset_size" \
              '.assets[]|select(.name==$name and .id==$id and .size==$size and .digest==$digest)' <<<"$release" >/dev/null
            archive="$RUNNER_TEMP/$key.archive"
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$archive"
            test "$(stat -c%s "$archive")" -eq "$asset_size"
            test "sha256:$(sha256sum "$archive"|awk '{print $1}')" = "$asset_digest"
            mkdir -p "$RUNNER_TEMP/$key"
            if test "$(jq -r --arg key "$key" '.[$key].archive_type' "$LOCK")" = tar.gz; then
              tar -xzf "$archive" -C "$RUNNER_TEMP/$key"
            else
              unzip -q "$archive" -d "$RUNNER_TEMP/$key"
            fi
          done
          nested=$(dirname "$(find "$RUNNER_TEMP/claim_adoption" -type f -name runtime.json -print -quit)")
          mkdir -p "$RUNNER_TEMP/adoption"
          cp -R "$nested"/. "$RUNNER_TEMP/adoption"/

      - name: Execute Gooo deployment decisions
        shell: bash
        run: |
          set -euo pipefail
          gooo="$RUNNER_TEMP/core/gooo"
          "$gooo" check --json "$SOURCE" > "$RUNNER_TEMP/deployment-syntax.json"
          "$gooo" check --semantic --json "$SOURCE" > "$RUNNER_TEMP/deployment-semantic.json"
          "$gooo" graph dump "$SOURCE" > "$RUNNER_TEMP/deployment-graph.json"
          jq -e '.status=="ok"' "$RUNNER_TEMP/deployment-syntax.json" "$RUNNER_TEMP/deployment-semantic.json" >/dev/null

          for tuple in \
            'ResolveDeploymentPacketReady:deployment-ready-receipt.json' \
            'PreserveMissingStateUnknown:deployment-missing-receipt.json' \
            'RefuteArtifactIdentityDrift:deployment-drift-receipt.json' \
            'RefuteHandlerAmbiguity:deployment-handler-receipt.json' \
            'RefuteExecutionAuthority:deployment-authority-receipt.json'; do
            activity=${tuple%%:*}; file=${tuple#*:}
            "$gooo" claim resolve "$SOURCE" --activity "$activity" --json > "$RUNNER_TEMP/$file"
          done
          mkdir -p "$RUNNER_TEMP/receipt-replay"
          equal=0
          for tuple in \
            'ResolveDeploymentPacketReady:deployment-ready-receipt.json' \
            'PreserveMissingStateUnknown:deployment-missing-receipt.json' \
            'RefuteArtifactIdentityDrift:deployment-drift-receipt.json' \
            'RefuteHandlerAmbiguity:deployment-handler-receipt.json' \
            'RefuteExecutionAuthority:deployment-authority-receipt.json'; do
            activity=${tuple%%:*}; file=${tuple#*:}
            "$gooo" claim resolve "$SOURCE" --activity "$activity" --json > "$RUNNER_TEMP/receipt-replay/$file"
            if cmp -s "$RUNNER_TEMP/$file" "$RUNNER_TEMP/receipt-replay/$file"; then equal=$((equal+1)); fi
          done
          jq -S -n --argjson equal "$equal" \
            '{schema:"gooo/infra-evidence/deployment-decision-replay/v1",receipts_total:5,receipts_equal:$equal}' \
            > "$RUNNER_TEMP/deployment-decision-replay.json"

      - name: Generate normal and adverse deployment packets
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/repository-before.bin"
          after="$RUNNER_TEMP/repository-after.bin"
          git status --porcelain=v1 -z --untracked-files=all > "$before"
          common=(
            "$RUNNER_TEMP/deployment-graph.json" "$DENOMINATOR" "$REQUEST"
            "$RUNNER_TEMP/infra_evidence" "$RUNNER_TEMP/adoption"
            "$RUNNER_TEMP/deployment-ready-receipt.json" "$RUNNER_TEMP/deployment-missing-receipt.json"
            "$RUNNER_TEMP/deployment-drift-receipt.json" "$RUNNER_TEMP/deployment-handler-receipt.json"
            "$RUNNER_TEMP/deployment-authority-receipt.json"
          )
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/deployment-rss" \
            bash "$GENERATOR" "${common[@]}" "$RUNNER_TEMP/deployment-contract.json" \
              "$RUNNER_TEMP/deployment-generation-manifest.json" "$RUNNER_TEMP/deployment-runbook.md" "$SUBJECT_SHA" complete
          bash "$GENERATOR" "${common[@]}" "$RUNNER_TEMP/deployment-contract-replay.json" \
            "$RUNNER_TEMP/deployment-generation-manifest-replay.json" "$RUNNER_TEMP/deployment-runbook-replay.md" "$SUBJECT_SHA" complete
          replay_equal=0
          for pair in 'deployment-contract.json:deployment-contract-replay.json' \
            'deployment-generation-manifest.json:deployment-generation-manifest-replay.json' \
            'deployment-runbook.md:deployment-runbook-replay.md'; do
            first=${pair%%:*}; second=${pair#*:}
            if cmp -s "$RUNNER_TEMP/$first" "$RUNNER_TEMP/$second"; then replay_equal=$((replay_equal+1)); fi
          done

          cp -R "$RUNNER_TEMP/infra_evidence" "$RUNNER_TEMP/infra-missing-state"
          cp "$RUNNER_TEMP/infra-missing-state/missing-state-v2.json" "$RUNNER_TEMP/infra-missing-state/infra-service-claim.json"
          missing_common=("${common[@]}"); missing_common[3]="$RUNNER_TEMP/infra-missing-state"
          bash "$GENERATOR" "${missing_common[@]}" "$RUNNER_TEMP/deployment-missing.json" \
            "$RUNNER_TEMP/deployment-missing-manifest.json" "$RUNNER_TEMP/deployment-missing.md" "$SUBJECT_SHA" missing-state

          cp -R "$RUNNER_TEMP/infra_evidence" "$RUNNER_TEMP/infra-drift"
          cp "$RUNNER_TEMP/infra-drift/deployment-drift.json" "$RUNNER_TEMP/infra-drift/infra-service-claim.json"
          drift_common=("${common[@]}"); drift_common[3]="$RUNNER_TEMP/infra-drift"
          bash "$GENERATOR" "${drift_common[@]}" "$RUNNER_TEMP/deployment-drift.json" \
            "$RUNNER_TEMP/deployment-drift-manifest.json" "$RUNNER_TEMP/deployment-drift.md" "$SUBJECT_SHA" artifact-drift

          cp -R "$RUNNER_TEMP/infra_evidence" "$RUNNER_TEMP/infra-handler"
          cp "$RUNNER_TEMP/infra-handler/ambiguous-handler.json" "$RUNNER_TEMP/infra-handler/infra-service-claim.json"
          handler_common=("${common[@]}"); handler_common[3]="$RUNNER_TEMP/infra-handler"
          bash "$GENERATOR" "${handler_common[@]}" "$RUNNER_TEMP/deployment-handler.json" \
            "$RUNNER_TEMP/deployment-handler-manifest.json" "$RUNNER_TEMP/deployment-handler.md" "$SUBJECT_SHA" handler-ambiguity

          jq '.authority.terraform_apply_authorized=true | .authority.deployment_execution_authorized=true' "$REQUEST" > "$RUNNER_TEMP/deployment-request-escalated.json"
          authority_common=("${common[@]}"); authority_common[2]="$RUNNER_TEMP/deployment-request-escalated.json"
          bash "$GENERATOR" "${authority_common[@]}" "$RUNNER_TEMP/deployment-authority.json" \
            "$RUNNER_TEMP/deployment-authority-manifest.json" "$RUNNER_TEMP/deployment-authority.md" "$SUBJECT_SHA" authority-escalation

          jq '(.nodes)|=map(select(.name!="GenerateDeploymentPacketArtifacts"))' "$RUNNER_TEMP/deployment-graph.json" > "$RUNNER_TEMP/deployment-graph-missing-activity.json"
          missing_meta_common=("${common[@]}"); missing_meta_common[0]="$RUNNER_TEMP/deployment-graph-missing-activity.json"
          if bash "$GENERATOR" "${missing_meta_common[@]}" "$RUNNER_TEMP/missing-meta.json" \
            "$RUNNER_TEMP/missing-meta-manifest.json" "$RUNNER_TEMP/missing-meta.md" "$SUBJECT_SHA" complete; then
            echo 'deployment generator accepted a missing Gooo activity' >&2
            exit 1
          fi

          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns-start_ns)/1000000 ))
          git status --porcelain=v1 -z --untracked-files=all > "$after"
          if cmp -s "$before" "$after"; then writes=0; else writes=1; fi

          repository_files=0; descendant_directories=0; go_files=0; go_lines=0; gooo_files=0; gooo_lines=0; per_file='[]'
          while IFS= read -r -d '' file; do repository_files=$((repository_files+1)); done \
            < <(find . -type f -not -path './.git/*' -not -path './README.md' -print0)
          while IFS= read -r -d '' directory; do descendant_directories=$((descendant_directories+1)); done \
            < <(find . -mindepth 1 -type d -not -path './.git' -not -path './.git/*' -print0)
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file" | tr -d ' '); path=${file#./}
            case "$file" in
              *.go) language=Go; go_files=$((go_files+1)); go_lines=$((go_lines+lines)) ;;
              *.gooo) language=Gooo; gooo_files=$((gooo_files+1)); gooo_lines=$((gooo_lines+lines)) ;;
            esac
            per_file=$(jq -c --arg language "$language" --arg path "$path" --argjson lines "$lines" \
              '.+[{language:$language,path:$path,lines:$lines}]' <<<"$per_file")
          done < <(find . -type f \( -name '*.go' -o -name '*.gooo' \) -not -path './.git/*' -print0 | sort -z)

          jq -S -n --arg subject_sha "$SUBJECT_SHA" --arg go_version "$(go env GOVERSION)" \
            --argjson module_roots "$(jq .module_roots "$RUNNER_TEMP/go-fix-observation.json")" \
            --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/deployment-rss")" --argjson wall_ms "$wall_ms" \
            --argjson writes "$writes" --argjson replay_equal "$replay_equal" \
            --argjson decision_equal "$(jq .receipts_equal "$RUNNER_TEMP/deployment-decision-replay.json")" \
            --argjson repository_files "$repository_files" --argjson descendant_directories "$descendant_directories" \
            --argjson go_files "$go_files" --argjson go_lines "$go_lines" --argjson gooo_files "$gooo_files" \
            --argjson gooo_lines "$gooo_lines" --argjson per_file "$per_file" '
            {schema:"gooo/infra-evidence/deployment-contract-packet-runtime/v1",subject_sha:$subject_sha,
              go_version:$go_version,go_fix_module_roots:$module_roots,release_locks_observed:3,
              decision_receipts_equal:$decision_equal,replay_comparisons_equal:$replay_equal,
              peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms,
              inventory:{repository_files:$repository_files,descendant_directories:$descendant_directories,
                root_readme_excluded:true,go:{files:$go_files,physical_lines:$go_lines},
                gooo:{files:$gooo_files,physical_lines:$gooo_lines},per_file:$per_file},
              repository_writes:$writes,local_tests_run:0,cross_project_required_gates:0}
          ' > "$RUNNER_TEMP/deployment-runtime.json"

      - name: Close fixed deployment-packet denominator
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$DENOMINATOR" "$RUNNER_TEMP/deployment-contract.json" "$RUNNER_TEMP/deployment-generation-manifest.json"
            "$RUNNER_TEMP/deployment-runbook.md" "$RUNNER_TEMP/deployment-missing.json" "$RUNNER_TEMP/deployment-drift.json"
            "$RUNNER_TEMP/deployment-handler.json" "$RUNNER_TEMP/deployment-authority.json" "$RUNNER_TEMP/deployment-runtime.json"
          )
          bash "$EVALUATOR" "${args[@]}" "$RUNNER_TEMP/deployment-conformance.json" "$SUBJECT_SHA"
          bash "$EVALUATOR" "${args[@]}" "$RUNNER_TEMP/deployment-conformance-replay.json" "$SUBJECT_SHA"
          cmp -s "$RUNNER_TEMP/deployment-conformance.json" "$RUNNER_TEMP/deployment-conformance-replay.json"
          jq -e '
            .decision=="INFRA_DEPLOYMENT_CONTRACT_PACKET_CONFORMANT" and .summary.closed_cells==15 and
            .summary.release_inputs_observed==3 and .summary.infra_evidence_cells_observed==12 and
            .summary.claim_adoption_cells_observed==12 and .summary.terraform_bindings_observed==1 and
            .summary.openapi_service_bindings_observed==1 and .summary.semantic_edges_observed==6 and
            .summary.deployment_chain_cells_observed==4 and .summary.released_claim_tuples_observed==3 and
            .summary.released_claim_fields_observed==18 and .summary.meta_decision_receipts_observed==5 and
            .summary.generated_artifacts_observed==3 and .summary.counterexamples_observed==4 and
            .summary.replay_comparisons_equal==3 and .summary.repository_writes==0 and
            .summary.local_tests_run==0 and .summary.cross_project_required_gates==0 and
            ([.proofs[]|select(.closed==5 and .total==5)]|length)==3 and
            ([.indicator_classes[]|select(.closed==5 and .total==5)]|length)==3 and
            .claim.next_operation=="PUBLISH_IMMUTABLE_INFRA_DEPLOYMENT_PACKET_RELEASE"
          ' "$RUNNER_TEMP/deployment-conformance.json" >/dev/null

      - name: Publish human-readable deployment metrics
        shell: bash
        run: |
          {
            echo '## Gooo infrastructure deployment contract packet'
            echo
            jq -r '
              "- conformance cells: \(.summary.closed_cells)/\(.summary.total_cells) CLOSED",
              "- release inputs: \(.summary.release_inputs_observed)/\(.summary.release_inputs_total)",
              "- infra / claim-adoption cells: \(.summary.infra_evidence_cells_observed)/\(.summary.infra_evidence_cells_total) / \(.summary.claim_adoption_cells_observed)/\(.summary.claim_adoption_cells_total)",
              "- Terraform / OpenAPI-service bindings: \(.summary.terraform_bindings_observed)/\(.summary.terraform_bindings_total) / \(.summary.openapi_service_bindings_observed)/\(.summary.openapi_service_bindings_total)",
              "- semantic edges / deployment chain: \(.summary.semantic_edges_observed)/\(.summary.semantic_edges_total) / \(.summary.deployment_chain_cells_observed)/\(.summary.deployment_chain_cells_total)",
              "- claim tuples / fields: \(.summary.released_claim_tuples_observed)/\(.summary.released_claim_tuples_total) / \(.summary.released_claim_fields_observed)/\(.summary.released_claim_fields_total)",
              "- Gooo decision receipts: \(.summary.meta_decision_receipts_observed)/\(.summary.meta_decision_receipts_total)",
              "- generated artifacts / counterexamples: \(.summary.generated_artifacts_observed)/\(.summary.generated_artifacts_total) / \(.summary.counterexamples_observed)/\(.summary.counterexamples_total)",
              "- writes / local tests / cross-project gates: \(.summary.repository_writes) / \(.summary.local_tests_run) / \(.summary.cross_project_required_gates)",
              "- peak RSS / wall time: \(.performance.peak_rss_kib) KiB / \(.performance.wall_ms) ms",
              "- files / descendant directories: \(.inventory.repository_files) / \(.inventory.descendant_directories)",
              "- Go files / lines: \(.inventory.go.files) / \(.inventory.go.physical_lines)",
              "- Gooo files / lines: \(.inventory.gooo.files) / \(.inventory.gooo.physical_lines)"
            ' "$RUNNER_TEMP/deployment-conformance.json"
            echo
            cat "$RUNNER_TEMP/deployment-runbook.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce zero input-repository writes
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deployment-contract-packet-${{ env.SUBJECT_SHA }}
          path: |
            ${{ runner.temp }}/go-fix-observation.json
            ${{ runner.temp }}/deployment-syntax.json
            ${{ runner.temp }}/deployment-semantic.json
            ${{ runner.temp }}/deployment-graph.json
            ${{ runner.temp }}/deployment-ready-receipt.json
            ${{ runner.temp }}/deployment-missing-receipt.json
            ${{ runner.temp }}/deployment-drift-receipt.json
            ${{ runner.temp }}/deployment-handler-receipt.json
            ${{ runner.temp }}/deployment-authority-receipt.json
            ${{ runner.temp }}/deployment-decision-replay.json
            ${{ runner.temp }}/deployment-contract.json
            ${{ runner.temp }}/deployment-generation-manifest.json
            ${{ runner.temp }}/deployment-runbook.md
            ${{ runner.temp }}/deployment-contract-replay.json
            ${{ runner.temp }}/deployment-generation-manifest-replay.json
            ${{ runner.temp }}/deployment-runbook-replay.md
            ${{ runner.temp }}/deployment-missing.json
            ${{ runner.temp }}/deployment-drift.json
            ${{ runner.temp }}/deployment-handler.json
            ${{ runner.temp }}/deployment-authority.json
            ${{ runner.temp }}/deployment-runtime.json
            ${{ runner.temp }}/deployment-conformance.json
            ${{ runner.temp }}/deployment-conformance-replay.json
          if-no-files-found: warn
