name: Core v0.2 infra service symbol conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - name: Bind exact subject identity
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - name: Conform Go 1.27 observer tool
        run: |
          set -euo pipefail
          case "$(go env GOVERSION)" in go1.27.*) ;; *) exit 1 ;; esac
          test -z "$(gofmt -d scripts/observe-service-symbol.go)"
          go tool fix -diff scripts/observe-service-symbol.go > "$RUNNER_TEMP/go-fix.diff"
          test ! -s "$RUNNER_TEMP/go-fix.diff"
          go vet scripts/observe-service-symbol.go
          jq -n --arg version "$(go env GOVERSION)" '{schema:"gooo/infra-evidence/go-toolchain/v1",version:$version,gofmt_changes:0,fix_changes:0,vet_findings:0}' > "$RUNNER_TEMP/go-toolchain.json"
      - name: Download immutable core and generator releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/gooo" "$RUNNER_TEMP/generator"
          verify_release() {
            lock=$1
            prefix=$2
            repository=$(jq -r .repository "$lock")
            tag=$(jq -r .tag "$lock")
            gh api "repos/$repository/releases/tags/$tag" > "$RUNNER_TEMP/$prefix-release.json"
            gh api "repos/$repository/git/ref/tags/$tag" > "$RUNNER_TEMP/$prefix-ref.json"
            object_sha=$(jq -r '.object.sha' "$RUNNER_TEMP/$prefix-ref.json")
            gh api "repos/$repository/git/tags/$object_sha" > "$RUNNER_TEMP/$prefix-tag.json"
            jq -e --arg object_sha "$(jq -r .tag_object_sha "$lock")" --arg target_sha "$(jq -r .target_commit_sha "$lock")" \
              '.draft==false and .prerelease==true' "$RUNNER_TEMP/$prefix-release.json" >/dev/null
            jq -e --arg object_sha "$(jq -r .tag_object_sha "$lock")" '.object.type=="tag" and .object.sha==$object_sha' "$RUNNER_TEMP/$prefix-ref.json" >/dev/null
            jq -e --arg target_sha "$(jq -r .target_commit_sha "$lock")" '.object.type=="commit" and .object.sha==$target_sha' "$RUNNER_TEMP/$prefix-tag.json" >/dev/null
          }
          core_lock=contracts/core-v0.2-release-lock-v1.json
          generator_lock=contracts/generator-v0.3.1-release-lock-v1.json
          verify_release "$core_lock" core
          verify_release "$generator_lock" generator
          core_asset=$(jq -r '.assets[0].name' "$core_lock")
          core_url=$(jq -r --arg name "$core_asset" '.assets[]|select(.name==$name)|.browser_download_url' "$RUNNER_TEMP/core-release.json")
          curl --fail --location --retry 3 "$core_url" --output "$RUNNER_TEMP/assets/$core_asset"
          test "$(sha256sum "$RUNNER_TEMP/assets/$core_asset"|awk '{print $1}')" = "$(jq -r '.assets[0].sha256' "$core_lock")"
          tar -xzf "$RUNNER_TEMP/assets/$core_asset" -C "$RUNNER_TEMP/gooo"
          generator_asset=$(jq -r '.asset.name' "$generator_lock")
          generator_url=$(jq -r --arg name "$generator_asset" '.assets[]|select(.name==$name)|.browser_download_url' "$RUNNER_TEMP/generator-release.json")
          curl --fail --location --retry 3 "$generator_url" --output "$RUNNER_TEMP/assets/$generator_asset"
          test "$(sha256sum "$RUNNER_TEMP/assets/$generator_asset"|awk '{print $1}')" = "$(jq -r '.asset.sha256' "$generator_lock")"
          tar -xzf "$RUNNER_TEMP/assets/$generator_asset" -C "$RUNNER_TEMP/generator"
      - name: Observe Gooo semantics and Go service symbol
        run: |
          set -euo pipefail
          gooo="$RUNNER_TEMP/gooo/gooo"
          generator="$RUNNER_TEMP/generator/gooo-evidence-generator-v0.3.1-dev"
          source=examples/checkout-service/main-v0.2.gooo
          before="$RUNNER_TEMP/before.bin"
          after="$RUNNER_TEMP/after.bin"
          git status --porcelain=v1 -z --untracked-files=all > "$before"
          "$gooo" version --json > "$RUNNER_TEMP/version.json"
          "$gooo" check --json "$source" > "$RUNNER_TEMP/syntax.json"
          "$gooo" check --semantic --json "$source" > "$RUNNER_TEMP/semantic.json"
          start_ns=$(date +%s%N)
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" "$gooo" graph dump "$source" > "$RUNNER_TEMP/graph.json"
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns-start_ns)/1000000 ))
          peak_rss_kib=$(awk -F: '/Maximum resident set size/ {gsub(/ /,"",$2); print $2}' "$RUNNER_TEMP/time.txt")
          bash "$generator/scripts/bind-activity-resolutions.sh" "$gooo" "$source" "$RUNNER_TEMP/graph.json" \
            contracts/infra-activity-selectors-v1.json contracts/core-v0.2-release-lock-v1.json "$RUNNER_TEMP/enriched-graph.json" project_graph
          go run scripts/observe-service-symbol.go fixtures/checkout-service/project-v2.json > "$RUNNER_TEMP/service-symbol.json"
          git status --porcelain=v1 -z --untracked-files=all > "$after"
          if cmp -s "$before" "$after"; then writes=0; else writes=1; fi
          jq -n --arg head "$SUBJECT_SHA" --arg before_digest "sha256:$(sha256sum "$before"|awk '{print $1}')" \
            --arg after_digest "sha256:$(sha256sum "$after"|awk '{print $1}')" --argjson writes "$writes" \
            --argjson peak_rss_kib "$peak_rss_kib" --argjson wall_ms "$wall_ms" \
            --slurpfile version "$RUNNER_TEMP/version.json" --slurpfile syntax "$RUNNER_TEMP/syntax.json" \
            --slurpfile semantic "$RUNNER_TEMP/semantic.json" --slurpfile toolchain "$RUNNER_TEMP/go-toolchain.json" \
            '{schema:"gooo/infra-evidence/runtime-observation/v2",subject_sha:$head,release_identity_observed:true,version:$version[0],syntax_check:$syntax[0],semantic_check:$semantic[0],
              go_toolchain:$toolchain[0],performance:{graph_peak_rss_kib:$peak_rss_kib,graph_wall_ms:$wall_ms},repository:{before_digest:$before_digest,after_digest:$after_digest,writes:$writes}}' > "$RUNNER_TEMP/runtime-v2.json"
      - name: Evaluate exact complete and adversarial cases
        run: |
          set -euo pipefail
          candidate=fixtures/checkout-service
          evaluate() { bash scripts/evaluate-v2.sh "$GITHUB_WORKSPACE" "$1" "$RUNNER_TEMP/runtime-v2.json" "$2" "$3" "$4" "$SUBJECT_SHA" "$5"; }
          evaluate "$candidate" "$RUNNER_TEMP/enriched-graph.json" "$RUNNER_TEMP/service-symbol.json" "$RUNNER_TEMP/infra-service-claim.json" complete
          evaluate "$candidate" "$RUNNER_TEMP/enriched-graph.json" "$RUNNER_TEMP/service-symbol.json" "$RUNNER_TEMP/replay.json" complete
          cmp -s "$RUNNER_TEMP/infra-service-claim.json" "$RUNNER_TEMP/replay.json"
          jq -e '.decision=="EVIDENCE_CHAIN_CLOSED" and .summary=={total:12,closed:12,unknown:0,refuted:0,direct_missing:0,dependency_blocked:0,repository_writes:0} and
            .authority.core_activity_receipts==12 and .authority.core_identity_anchors==1 and
            all(.proofs[];.closed==.total) and all(.indicator_classes[];.closed==.total) and
            (.indicators[]|select(.id=="gooo.metric.infra-evidence.semantic-edges.v2")|.value==6 and .total==6) and
            (.indicators[]|select(.id=="gooo.metric.infra-evidence.service-symbol-bindings.v2")|.value==1 and .total==1)' "$RUNNER_TEMP/infra-service-claim.json" >/dev/null
          cp -R "$candidate" "$RUNNER_TEMP/missing-build"
          rm "$RUNNER_TEMP/missing-build/build/receipt-v2.json"
          go run scripts/observe-service-symbol.go "$RUNNER_TEMP/missing-build/project-v2.json" > "$RUNNER_TEMP/missing-build-symbol.json"
          evaluate "$RUNNER_TEMP/missing-build" "$RUNNER_TEMP/enriched-graph.json" "$RUNNER_TEMP/missing-build-symbol.json" "$RUNNER_TEMP/missing-build.json" missing-build
          jq -e '.decision=="INCOMPLETE" and .summary.closed==9 and .summary.unknown==3 and .summary.refuted==0 and .summary.direct_missing==1 and .summary.dependency_blocked==2 and
            .claim.stage=="BUILD" and .claim.step=="BIND_SERVICE_ARTIFACT_PROVENANCE" and .claim.reason=="SERVICE_ARTIFACT_PROVENANCE_UNAVAILABLE" and .claim.unknown_class=="DIRECT_MISSING"' "$RUNNER_TEMP/missing-build.json" >/dev/null
          cp -R "$candidate" "$RUNNER_TEMP/missing-state"
          rm "$RUNNER_TEMP/missing-state/terraform/state.json"
          go run scripts/observe-service-symbol.go "$RUNNER_TEMP/missing-state/project-v2.json" > "$RUNNER_TEMP/missing-state-symbol.json"
          evaluate "$RUNNER_TEMP/missing-state" "$RUNNER_TEMP/enriched-graph.json" "$RUNNER_TEMP/missing-state-symbol.json" "$RUNNER_TEMP/missing-state-v2.json" missing-state
          jq -e '.decision=="INCOMPLETE" and .summary.closed==9 and .summary.unknown==3 and .summary.refuted==0 and .summary.direct_missing==1 and .summary.dependency_blocked==2 and
            .claim.stage=="INFRA_STATE" and .claim.step=="BIND_TERRAFORM_STATE" and .claim.reason=="TERRAFORM_STATE_UNAVAILABLE" and .claim.unknown_class=="DIRECT_MISSING"' "$RUNNER_TEMP/missing-state-v2.json" >/dev/null
          cp -R "$candidate" "$RUNNER_TEMP/ambiguous-handler"
          awk '{print; if ($0 ~ /http.HandleFunc\("GET \/health", health\)/) print}' "$RUNNER_TEMP/ambiguous-handler/service/main-v2.go" > "$RUNNER_TEMP/ambiguous.go"
          mv "$RUNNER_TEMP/ambiguous.go" "$RUNNER_TEMP/ambiguous-handler/service/main-v2.go"
          go run scripts/observe-service-symbol.go "$RUNNER_TEMP/ambiguous-handler/project-v2.json" > "$RUNNER_TEMP/ambiguous-handler-symbol.json"
          evaluate "$RUNNER_TEMP/ambiguous-handler" "$RUNNER_TEMP/enriched-graph.json" "$RUNNER_TEMP/ambiguous-handler-symbol.json" "$RUNNER_TEMP/ambiguous-handler.json" ambiguous-handler
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==8 and .summary.unknown==0 and .summary.refuted==4 and
            .claim.stage=="SERVICE_SYMBOL" and .claim.step=="BIND_OPENAPI_OPERATION_TO_GO_HANDLER" and .claim.reason=="GO_HANDLER_REGISTRATION_CARDINALITY_MISMATCH"' "$RUNNER_TEMP/ambiguous-handler.json" >/dev/null
          jq '.activity_resolution_observation.core_release.target_commit_sha="0000000000000000000000000000000000000000"' "$RUNNER_TEMP/enriched-graph.json" > "$RUNNER_TEMP/identity-mismatch-graph.json"
          evaluate "$candidate" "$RUNNER_TEMP/identity-mismatch-graph.json" "$RUNNER_TEMP/service-symbol.json" "$RUNNER_TEMP/identity-mismatch.json" identity-mismatch
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==0 and .summary.unknown==0 and .summary.refuted==12 and
            .claim.stage=="CORE_RELEASE" and .claim.step=="OBSERVE_RELEASED_GOOO_IDENTITY" and .claim.reason=="CORE_RESOLUTION_RELEASE_IDENTITY_MISMATCH"' "$RUNNER_TEMP/identity-mismatch.json" >/dev/null
          cp -R "$candidate" "$RUNNER_TEMP/deployment-drift"
          jq '.artifact_digest="sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"' "$RUNNER_TEMP/deployment-drift/deployment/receipt.json" > "$RUNNER_TEMP/drift-receipt.json"
          mv "$RUNNER_TEMP/drift-receipt.json" "$RUNNER_TEMP/deployment-drift/deployment/receipt.json"
          go run scripts/observe-service-symbol.go "$RUNNER_TEMP/deployment-drift/project-v2.json" > "$RUNNER_TEMP/deployment-drift-symbol.json"
          evaluate "$RUNNER_TEMP/deployment-drift" "$RUNNER_TEMP/enriched-graph.json" "$RUNNER_TEMP/deployment-drift-symbol.json" "$RUNNER_TEMP/deployment-drift.json" deployment-drift
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==10 and .summary.unknown==0 and .summary.refuted==2 and
            .claim.stage=="DEPLOYMENT" and .claim.step=="BIND_DEPLOYMENT_OUTPUT" and .claim.reason=="ARTIFACT_IDENTITY_MISMATCH"' "$RUNNER_TEMP/deployment-drift.json" >/dev/null
      - name: Publish human-readable exact indicators
        run: |
          {
            echo '## Infrastructure to service semantic evidence'
            echo
            jq -r '"- decision: \(.decision)","- completion: \(.summary.closed)/\(.summary.total) CLOSED; UNKNOWN \(.summary.unknown); REFUTED \(.summary.refuted)",
              "- proof cells: " + ([.proofs[]|"\(.choice) \(.closed)/\(.total)"]|join(", ")),
              "- indicator cells: " + ([.indicator_classes[]|"\(.class) \(.closed)/\(.total)"]|join(", ")),
              (.indicators[]|if has("total") then "- \(.id): \(.value)/\(.total) \(.unit) [\(.state)]" else "- \(.id): \(.value) \(.unit) [\(.state)]" end),
              "- OpenAPI: \(.identities.openapi_method) \(.identities.openapi_path) / \(.identities.openapi_operation)",
              "- Go handler: \(.identities.service_handler)",
              "- Terraform execution: \(.authority.terraform_execution)","- live cloud state: \(.authority.live_cloud_state)","- deployment execution: \(.authority.deployment_execution)","- live network probe: \(.authority.live_network_probe)",
              "- deterministic replay: true","- local test executions: 0"' "$RUNNER_TEMP/infra-service-claim.json"
            jq -r '"- missing build: \(.summary.closed)/\(.summary.total), direct \(.summary.direct_missing), dependency \(.summary.dependency_blocked), \(.claim.stage) / \(.claim.step) / \(.claim.reason)",
              "- missing state: \(input_filename)"' "$RUNNER_TEMP/missing-build.json"
            jq -r '"- missing state: \(.summary.closed)/\(.summary.total), direct \(.summary.direct_missing), dependency \(.summary.dependency_blocked), \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/missing-state-v2.json"
            jq -r '"- ambiguous handler: CLOSED \(.summary.closed), REFUTED \(.summary.refuted), \(.claim.reason)"' "$RUNNER_TEMP/ambiguous-handler.json"
            jq -r '"- core identity mismatch: CLOSED \(.summary.closed), REFUTED \(.summary.refuted), \(.claim.reason)"' "$RUNNER_TEMP/identity-mismatch.json"
            jq -r '"- deployment drift: CLOSED \(.summary.closed), REFUTED \(.summary.refuted), \(.claim.reason)"' "$RUNNER_TEMP/deployment-drift.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce zero repository writes
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: infra-service-symbol-${{ env.SUBJECT_SHA }}
          path: |
            ${{ runner.temp }}/go-toolchain.json
            ${{ runner.temp }}/runtime-v2.json
            ${{ runner.temp }}/enriched-graph.json
            ${{ runner.temp }}/service-symbol.json
            ${{ runner.temp }}/infra-service-claim.json
            ${{ runner.temp }}/replay.json
            ${{ runner.temp }}/missing-build.json
            ${{ runner.temp }}/missing-state-v2.json
            ${{ runner.temp }}/ambiguous-handler.json
            ${{ runner.temp }}/identity-mismatch.json
            ${{ runner.temp }}/deployment-drift.json
