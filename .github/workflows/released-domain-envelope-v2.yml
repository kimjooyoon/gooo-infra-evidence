name: Released Domain Envelope v2 Adoption Candidate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-domain-envelope-v2:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORK_DIR: /tmp/gooo-released-domain-envelope-v2
      ARTIFACT_DIR: /tmp/gooo-released-domain-envelope-v2-artifact
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          check-latest: true

      - name: Acquire pinned released inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR" "$ARTIFACT_DIR"
          mkdir -p "$WORK_DIR/core/bin" "$WORK_DIR/kit" "$WORK_DIR/infra" "$WORK_DIR/reports" "$ARTIFACT_DIR"
          snapshot() {
            find . -path './.git' -prune -o -type f ! -path './README.md' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          snapshot > "$WORK_DIR/repository-before.sha256"

          LOCK=contracts/released-domain-envelope-v2-adoption-release-lock-v1.json
          DENOM=contracts/released-domain-envelope-v2-adoption-denominator-v1.json
          PACKET=contracts/released-domain-envelope-v2-adoption-packet-v1.json
          jq -e --arg sha "$SUBJECT_SHA" --arg repo "${{ github.repository }}" \
            '.schema=="gooo/infra-evidence/released-domain-envelope-v2-adoption-release-lock/v1" and
             .authority.repository_writes==0 and .authority.local_tests==0 and
             .authority.cross_project_required_gates==0 and
             ($repo=="kimjooyoon/gooo-infra-evidence" or $repo=="${{ github.repository }}")' "$LOCK" >/dev/null
          jq -e '.schema=="gooo/infra-evidence/released-domain-envelope-v2-adoption-denominator/v1" and .target_cells==12 and (.cells|length)==12 and ([.cells[].id]|unique|length)==12 and ([.cells[].activity]|unique|length)==12' "$DENOM" >/dev/null
          jq -e '.schema=="gooo/infra-evidence/released-domain-envelope-v2-adoption-packet/v1" and .adoption.released_domain.observed==0 and .adoption.released_domain.total==1' "$PACKET" >/dev/null

          download_asset() {
            local repository=$1
            local release_json=$2
            local asset_id=$3
            local asset_name=$4
            local expected_size=$5
            local expected_sha=$6
            local output=$7
            jq -e --argjson id "$asset_id" --arg name "$asset_name" --argjson size "$expected_size" \
              '.assets[] | select(.id==$id) | .name==$name and .size==$size' "$release_json" >/dev/null
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            test "$(sha256sum "$output" | awk '{print $1}')" = "$expected_sha"
          }

          verify_release() {
            local repository=$1
            local tag=$2
            local release_id=$3
            local target=$4
            local output=$5
            gh api "repos/$repository/releases/tags/$tag" > "$output"
            jq -e --arg tag "$tag" --argjson release_id "$release_id" --arg target "$target" \
              '.tag_name==$tag and .id==$release_id and .prerelease==true and .target_commitish != null' "$output" >/dev/null
            test "$(git ls-remote "https://github.com/$repository.git" "refs/tags/$tag" | awk '{print $1}')" = "$target"
          }

          core_repository=$(jq -r '.core.repository' "$LOCK")
          core_tag=$(jq -r '.core.tag' "$LOCK")
          core_release_id=$(jq -r '.core.release_id' "$LOCK")
          core_target=$(jq -r '.core.target_commit_sha' "$LOCK")
          verify_release "$core_repository" "$core_tag" "$core_release_id" "$core_target" "$WORK_DIR/core/release.json"
          download_asset "$core_repository" "$WORK_DIR/core/release.json" \
            "$(jq -r '.core.assets.linux.id' "$LOCK")" \
            "$(jq -r '.core.assets.linux.name' "$LOCK")" \
            "$(jq -r '.core.assets.linux.size' "$LOCK")" \
            "$(jq -r '.core.assets.linux.sha256' "$LOCK")" \
            "$WORK_DIR/core/gooo-linux-amd64.tar.gz"
          download_asset "$core_repository" "$WORK_DIR/core/release.json" \
            "$(jq -r '.core.assets.checksums.id' "$LOCK")" \
            "$(jq -r '.core.assets.checksums.name' "$LOCK")" \
            "$(jq -r '.core.assets.checksums.size' "$LOCK")" \
            "$(jq -r '.core.assets.checksums.sha256' "$LOCK")" \
            "$WORK_DIR/core/SHA256SUMS"
          (cd "$WORK_DIR/core" && sha256sum -c SHA256SUMS --ignore-missing)
          tar -xzf "$WORK_DIR/core/gooo-linux-amd64.tar.gz" -C "$WORK_DIR/core/bin"
          find "$WORK_DIR/core/bin" -type f -name gooo -exec chmod +x {} \;
          GO0=$(find "$WORK_DIR/core/bin" -type f -name gooo -print -quit)
          test -n "$GO0"
          printf '%s\n' "$GO0" > "$WORK_DIR/gooo-path"

          spec_repository=$(jq -r '.interchange_spec.repository' "$LOCK")
          spec_tag=$(jq -r '.interchange_spec.tag' "$LOCK")
          spec_release_id=$(jq -r '.interchange_spec.release_id' "$LOCK")
          spec_target=$(jq -r '.interchange_spec.target_commit_sha' "$LOCK")
          verify_release "$spec_repository" "$spec_tag" "$spec_release_id" "$spec_target" "$WORK_DIR/kit/release.json"
          download_asset "$spec_repository" "$WORK_DIR/kit/release.json" \
            "$(jq -r '.interchange_spec.asset.id' "$LOCK")" \
            "$(jq -r '.interchange_spec.asset.name' "$LOCK")" \
            "$(jq -r '.interchange_spec.asset.size' "$LOCK")" \
            "$(jq -r '.interchange_spec.asset.sha256' "$LOCK")" \
            "$WORK_DIR/kit/gooo-interchange-consumer-kit-v2.tar.gz"
          tar -xzf "$WORK_DIR/kit/gooo-interchange-consumer-kit-v2.tar.gz" -C "$WORK_DIR/kit"
          KIT_HOME="$WORK_DIR/kit/consumer-kit-v2"
          test -d "$KIT_HOME"
          (cd "$KIT_HOME" && sha256sum -c SHA256SUMS)
          jq -e '.schema=="gooo/interchange/released-domain-consumer-kit-manifest/v2" and .kit_version=="v2"' "$KIT_HOME/manifest.json" >/dev/null
          printf '%s\n' "$KIT_HOME/scripts/conform-released-envelope-v2.sh" > "$WORK_DIR/conformer-path"
          test -x "$KIT_HOME/scripts/conform-released-envelope-v2.sh"

          infra_repository=$(jq -r '.infra.repository' "$LOCK")
          infra_tag=$(jq -r '.infra.tag' "$LOCK")
          infra_release_id=$(jq -r '.infra.release_id' "$LOCK")
          infra_target=$(jq -r '.infra.target_commit_sha' "$LOCK")
          verify_release "$infra_repository" "$infra_tag" "$infra_release_id" "$infra_target" "$WORK_DIR/infra/release.json"
          download_asset "$infra_repository" "$WORK_DIR/infra/release.json" \
            "$(jq -r '.infra.assets.plan.id' "$LOCK")" \
            "$(jq -r '.infra.assets.plan.name' "$LOCK")" \
            "$(jq -r '.infra.assets.plan.size' "$LOCK")" \
            "$(jq -r '.infra.assets.plan.sha256' "$LOCK")" \
            "$WORK_DIR/infra/deployment-plan.json"
          download_asset "$infra_repository" "$WORK_DIR/infra/release.json" \
            "$(jq -r '.infra.assets.replay.id' "$LOCK")" \
            "$(jq -r '.infra.assets.replay.name' "$LOCK")" \
            "$(jq -r '.infra.assets.replay.size' "$LOCK")" \
            "$(jq -r '.infra.assets.replay.sha256' "$LOCK")" \
            "$WORK_DIR/infra/semantic-deployment-plan-replay.json"
          jq -e '.schema=="gooo/infra-evidence/semantic-deployment-plan/v1" and .decision=="DEPLOYMENT_PLAN_GENERATED" and (.dependencies|length)==8 and .prior_contract.summary.openapi_bindings==1 and .prior_contract.summary.terraform_bindings==1 and .prior_contract.summary.deployment_chain_cells==4' "$WORK_DIR/infra/deployment-plan.json" >/dev/null
          jq -e '.schema=="gooo/infra-evidence/semantic-deployment-plan-replay/v1" and .comparisons_satisfied==.comparisons_total and .mismatches==0' "$WORK_DIR/infra/semantic-deployment-plan-replay.json" >/dev/null

      - name: Resolve twelve released Core activities
        shell: bash
        run: |
          set -euo pipefail
          gooo=$(cat "$WORK_DIR/gooo-path")
          source=examples/released-domain-envelope-v2/main.gooo
          denominator=contracts/released-domain-envelope-v2-adoption-denominator-v1.json
          /usr/bin/time -f '%M' -o "$WORK_DIR/core-rss-kib" "$gooo" graph dump "$source" > "$WORK_DIR/core-graph.json"
          jq -e --argjson expected "$(jq '.target_cells' "$denominator")" '([.nodes[]|select(.kind=="Activity")]|length)==$expected' "$WORK_DIR/core-graph.json" >/dev/null
          mkdir -p "$WORK_DIR/core-resolutions"
          while IFS=$'\t' read -r ordinal activity; do
            receipt=$(printf '%s/core-resolutions/%02d-%s.json' "$WORK_DIR" "$ordinal" "$activity")
            "$gooo" graph resolve-activity "$source" --name "$activity" > "$receipt"
          done < <(jq -r '.cells[]|[.ordinal,.activity]|@tsv' "$denominator")
          jq -S -s '.' "$WORK_DIR"/core-resolutions/*.json > "$WORK_DIR/core-receipts.json"
          jq -e --argjson expected "$(jq '.target_cells' "$denominator")" 'type=="array" and length==$expected and all(.[]; .schema=="gooo/activity-cardinality-resolution/v1" and .decision=="CLOSED" and .occurrences==1 and .claim.state=="CLOSED" and .claim.reason=="ACTIVITY_UNIQUELY_RESOLVED")' "$WORK_DIR/core-receipts.json" >/dev/null

      - name: Project, replay, and conform the eight-file envelope
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          denominator=contracts/released-domain-envelope-v2-adoption-denominator-v1.json
          lock=contracts/released-domain-envelope-v2-adoption-release-lock-v1.json
          mkdir -p "$WORK_DIR/bundle-a" "$WORK_DIR/bundle-b"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$WORK_DIR/projector-rss-kib" \
            bash scripts/project-released-domain-envelope-v2.sh "$root" "$WORK_DIR/core-receipts.json" \
              "$WORK_DIR/infra/deployment-plan.json" "$WORK_DIR/infra/semantic-deployment-plan-replay.json" \
              "$lock" "$denominator" "$WORK_DIR/bundle-a"
          end_ns=$(date +%s%N)
          echo $(( (end_ns - start_ns) / 1000000 )) > "$WORK_DIR/projector-wall-ms"
          bash scripts/project-released-domain-envelope-v2.sh "$root" "$WORK_DIR/core-receipts.json" \
            "$WORK_DIR/infra/deployment-plan.json" "$WORK_DIR/infra/semantic-deployment-plan-replay.json" \
            "$lock" "$denominator" "$WORK_DIR/bundle-b"

          files=(checksums.txt conformance.json evidence.ndjson project.json relations.ndjson replay.json resolutions.ndjson unknowns.ndjson)
          comparisons=0
          mismatches=0
          for file in "${files[@]}"; do
            comparisons=$((comparisons + 1))
            if ! cmp -s "$WORK_DIR/bundle-a/$file" "$WORK_DIR/bundle-b/$file"; then
              mismatches=$((mismatches + 1))
            fi
          done
          jq -S -n --argjson total "$comparisons" --argjson mismatches "$mismatches" \
            '{schema:"gooo/infra-evidence/released-domain-envelope-v2-file-replay/v1",comparisons_total:$total,comparisons_satisfied:($total-$mismatches),mismatches:$mismatches}' > "$WORK_DIR/file-replay.json"
          test "$mismatches" = 0

          conformer=$(cat "$WORK_DIR/conformer-path")
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$WORK_DIR/conformer-rss-kib" \
            bash "$conformer" "$WORK_DIR/bundle-a" "$WORK_DIR/bundle-b" "$WORK_DIR/conformance.json"
          end_ns=$(date +%s%N)
          echo $(( (end_ns - start_ns) / 1000000 )) > "$WORK_DIR/conformer-wall-ms"
          jq -e '.decision=="CONFORMANT" and .summary.closed==10 and .summary.total==10 and .summary.refuted==0 and .summary.unknown==0 and .summary.external_required_gates==0 and .summary.repository_writes==0' "$WORK_DIR/conformance.json" >/dev/null

      - name: Exercise UNKNOWN and REFUTED reports, merge report digests, then evaluate normal
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          denominator=contracts/released-domain-envelope-v2-adoption-denominator-v1.json
          target_activity=$(jq -r '.cells[]|select(.id=="INFRA_DEPENDENCY_SOURCE")|.activity' "$denominator")
          jq --arg activity "$target_activity" 'map(select(.selector.name!=$activity))' "$WORK_DIR/core-receipts.json" > "$WORK_DIR/core-missing.json"
          jq --arg activity "$target_activity" 'map(if .selector.name==$activity then (.decision="UNKNOWN" | .occurrences=0 | .claim.state="UNKNOWN" | .claim.reason="ACTIVITY_NOT_FOUND" | .claim.stage="RESOLUTION" | .claim.step="RESOLVE_ACTIVITY_CARDINALITY" | .claim.unknown_class="DIRECT_MISSING" | .claim.next_operation="PROVIDE_ACTIVITY_RESOLUTION_RECEIPT" | .claim.blocked_by=[]) else . end)' "$WORK_DIR/core-receipts.json" > "$WORK_DIR/core-valid-unknown.json"
          jq --arg activity "$target_activity" 'map(if .selector.name==$activity then (.decision="UNKNOWN" | .occurrences=1 | .claim.state="CLOSED" | .claim.reason="ACTIVITY_NOT_FOUND") else . end)' "$WORK_DIR/core-receipts.json" > "$WORK_DIR/core-malformed-unknown.json"
          jq --arg activity "$target_activity" 'map(if .selector.name==$activity then .decision="FIXED_POINT" else . end)' "$WORK_DIR/core-receipts.json" > "$WORK_DIR/core-fixed-point.json"

          lines() { awk 'END {print NR+0}' "$1"; }
          bundle_digest=$(cd "$WORK_DIR/bundle-a" && sha256sum checksums.txt conformance.json evidence.ndjson project.json relations.ndjson replay.json resolutions.ndjson unknowns.ndjson | sha256sum | awk '{print $1}')
          facts_base="$WORK_DIR/facts-pre.json"
          jq -S -n \
            --arg subject "$SUBJECT_SHA" \
            --arg core_target "$(jq -r '.core.target_commit_sha' contracts/released-domain-envelope-v2-adoption-release-lock-v1.json)" \
            --arg core_asset "$(jq -r '.core.assets.linux.sha256' contracts/released-domain-envelope-v2-adoption-release-lock-v1.json)" \
            --arg spec_target "$(jq -r '.interchange_spec.target_commit_sha' contracts/released-domain-envelope-v2-adoption-release-lock-v1.json)" \
            --arg spec_asset "$(jq -r '.interchange_spec.asset.sha256' contracts/released-domain-envelope-v2-adoption-release-lock-v1.json)" \
            --arg infra_target "$(jq -r '.infra.target_commit_sha' contracts/released-domain-envelope-v2-adoption-release-lock-v1.json)" \
            --arg infra_asset "$(jq -r '.infra.assets.plan.sha256' contracts/released-domain-envelope-v2-adoption-release-lock-v1.json)" \
            --arg bundle_digest "$bundle_digest" \
            --argjson activities "$(jq '[.nodes[]|select(.kind=="Activity")]|length' "$WORK_DIR/core-graph.json")" \
            --argjson resolutions "$(jq 'length' "$WORK_DIR/core-receipts.json")" \
            --argjson prior_relations "$(jq '.dependencies|length' "$WORK_DIR/infra/deployment-plan.json")" \
            --argjson prior_openapi "$(jq '.prior_contract.summary.openapi_bindings' "$WORK_DIR/infra/deployment-plan.json")" \
            --argjson prior_terraform "$(jq '.prior_contract.summary.terraform_bindings' "$WORK_DIR/infra/deployment-plan.json")" \
            --argjson prior_chain "$(jq '.prior_contract.summary.deployment_chain_cells' "$WORK_DIR/infra/deployment-plan.json")" \
            --argjson relation_lines "$(lines "$WORK_DIR/bundle-a/relations.ndjson")" \
            --argjson evidence_lines "$(lines "$WORK_DIR/bundle-a/evidence.ndjson")" \
            --argjson resolution_lines "$(lines "$WORK_DIR/bundle-a/resolutions.ndjson")" \
            --argjson unknown_lines "$(lines "$WORK_DIR/bundle-a/unknowns.ndjson")" \
            --argjson files "$(find "$WORK_DIR/bundle-a" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" \
            --argjson conformer_closed "$(jq '.summary.closed' "$WORK_DIR/conformance.json")" \
            --argjson conformer_total "$(jq '.summary.total' "$WORK_DIR/conformance.json")" \
            --argjson source_replay "$(jq 'if .comparisons_satisfied==.comparisons_total and .mismatches==0 then 1 else 0 end' "$WORK_DIR/infra/semantic-deployment-plan-replay.json")" \
            --argjson file_replay "$(jq '.comparisons_satisfied' "$WORK_DIR/file-replay.json")" \
            --argjson normal_paths 1 --argjson unknown_paths 2 --argjson refuted_paths 2 \
            '{schema:"gooo/infra-evidence/released-domain-envelope-v2-adoption-facts/v1",subject_sha:$subject,
              release_lock_verified:true,
              core_release:{verified:true,target_commit_sha:$core_target,asset_sha256:$core_asset},
              interchange_spec_release:{verified:true,target_commit_sha:$spec_target,asset_sha256:$spec_asset},
              infra_release:{verified:true,target_commit_sha:$infra_target,asset_sha256:$infra_asset},
              meta_activity_authority:{activities_observed:$activities,resolutions_observed:$resolutions},
              infra_dependency_source:{relations_observed:$prior_relations,prior_openapi_bindings:$prior_openapi,prior_terraform_bindings:$prior_terraform,prior_deployment_chain_cells:$prior_chain},
              product_projection:{observed:true,bundle_digest:$bundle_digest},
              envelope:{files:$files,relations:$relation_lines,evidence:$evidence_lines,resolutions:$resolution_lines,unknowns:$unknown_lines},
              conformer:{decision:"CONFORMANT",closed:$conformer_closed,total:$conformer_total},
              replay:{source_satisfied:$source_replay,file_satisfied:$file_replay},
              unknown_causality:null,refuted_counterexamples:null,
              paths:{normal:$normal_paths,unknown:$unknown_paths,refuted:$refuted_paths},
              authority:{repository_writes:0,local_tests:0,cross_project_required_gates:0,kit_source_checkout:0,conformer_copy:0,forbidden_authority_escalations:[]},
              artifacts:{product_projection:1,envelope:8,relations:8,evidence:8,resolutions:8,conformer:10,source_replay:1,file_replay:8},
              utility:{released_domain_adoption_observed:0,released_domain_adoption_total:1,external_utility_observed:0,external_utility_total:1,state:"UNKNOWN",reason:"NO_USER_EVIDENCE_OF_EXTERNAL_UTILITY"},
              metrics:{go_setup:"1.27.x",bundle_digest:$bundle_digest,go_fix_executed:0,repository_writes:0,local_tests:0,cross_project_required_gates:0}}' > "$facts_base"

          evaluate() {
            local receipts=$1
            local report=$2
            local phase=$3
            bash scripts/evaluate-released-domain-envelope-v2.sh "$root" "$denominator" "$receipts" "$facts_base" \
              "$WORK_DIR/bundle-a" "$WORK_DIR/conformance.json" "$report" "$phase"
          }
          evaluate "$WORK_DIR/core-missing.json" "$WORK_DIR/unknown-missing.json" unknown-missing
          evaluate "$WORK_DIR/core-valid-unknown.json" "$WORK_DIR/unknown-core.json" unknown-core
          evaluate "$WORK_DIR/core-malformed-unknown.json" "$WORK_DIR/refuted-malformed-unknown.json" refuted-malformed-unknown
          evaluate "$WORK_DIR/core-fixed-point.json" "$WORK_DIR/refuted-fixed-point.json" refuted-fixed-point

          jq -e '.decision=="INCOMPLETE" and .claim.state=="UNKNOWN" and .claim.unknown_class=="DIRECT_MISSING" and .claim.reason=="CORE_ACTIVITY_RESOLUTION_RECEIPT_UNAVAILABLE" and ([.cells[]|select(.reason=="DEPENDENCY_BLOCKED")]|length)>0' "$WORK_DIR/unknown-missing.json" >/dev/null
          jq -e '.decision=="INCOMPLETE" and .claim.state=="UNKNOWN" and .claim.reason=="ACTIVITY_NOT_FOUND" and .claim.unknown_class=="DIRECT_MISSING"' "$WORK_DIR/unknown-core.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.state=="REFUTED" and .claim.reason=="MALFORMED_CORE_UNKNOWN"' "$WORK_DIR/refuted-malformed-unknown.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.state=="REFUTED" and .claim.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION"' "$WORK_DIR/refuted-fixed-point.json" >/dev/null

          unknown_digest_a=$(sha256sum "$WORK_DIR/unknown-missing.json" | awk '{print $1}')
          unknown_digest_b=$(sha256sum "$WORK_DIR/unknown-core.json" | awk '{print $1}')
          refuted_digest_a=$(sha256sum "$WORK_DIR/refuted-malformed-unknown.json" | awk '{print $1}')
          refuted_digest_b=$(sha256sum "$WORK_DIR/refuted-fixed-point.json" | awk '{print $1}')
          jq -e '[.claim.stage,.claim.step,.claim.reason,.claim.unknown_class,.claim.next_operation,.claim.blocked_by] | all(.[]; . != null)' "$WORK_DIR/unknown-missing.json" "$WORK_DIR/unknown-core.json" >/dev/null
          unknown_coords=6
          direct_missing=$(jq '[.cells[]|select(.unknown_class=="DIRECT_MISSING")]|length' "$WORK_DIR/unknown-missing.json")
          dependency_blocked=$(jq '[.cells[]|select(.unknown_class=="DEPENDENCY_BLOCKED")]|length' "$WORK_DIR/unknown-missing.json")
          jq --arg a "$unknown_digest_a" --arg b "$unknown_digest_b" --arg c "$refuted_digest_a" --arg d "$refuted_digest_b" \
            --argjson coords "$unknown_coords" --argjson direct "$direct_missing" --argjson blocked "$dependency_blocked" \
            '.unknown_causality={reports_observed:2,report_digests:[$a,$b],coordinates_observed:$coords,direct_missing_observed:$direct,dependency_blocked_observed:$blocked} |
             .refuted_counterexamples={reports_observed:2,report_digests:[$c,$d],malformed_unknown_state:"REFUTED",fixed_point_state:"REFUTED"}' \
            "$facts_base" > "$WORK_DIR/facts.json"

      - name: Record measured artifact inventory and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          lines_for() { awk 'END {print NR+0}' "$1"; }
          find . -path './.git' -prune -o -type f ! -path './README.md' -print0 | sort -z |
            while IFS= read -r -d '' file; do
              case "$file" in
                *.go) language=Go ;;
                *.gooo) language=Gooo ;;
                *) continue ;;
              esac
              jq -S -n --arg path "${file#./}" --arg language "$language" --argjson lines "$(lines_for "$file")" '{path:$path,language:$language,physical_lines:$lines}'
            done > "$WORK_DIR/source-lines.ndjson"
          regular_files=$(find . -path './.git' -prune -o -type f ! -path './README.md' -print | wc -l | tr -d ' ')
          descendant_directories=$(find . -path './.git' -prune -o -mindepth 1 -type d -print | wc -l | tr -d ' ')
          module_roots=$(find . -path './.git' -prune -o -name go.mod -print | sed 's#^\./##' | sort | jq -R -s 'split("\n")|map(select(length>0) and .)')
          go_files=$(jq '[.[]|select(.language=="Go")]|length' "$WORK_DIR/source-lines.ndjson")
          go_lines=$(jq '[.[]|select(.language=="Go")|.physical_lines]|add//0' "$WORK_DIR/source-lines.ndjson")
          gooo_files=$(jq '[.[]|select(.language=="Gooo")]|length' "$WORK_DIR/source-lines.ndjson")
          gooo_lines=$(jq '[.[]|select(.language=="Gooo")|.physical_lines]|add//0' "$WORK_DIR/source-lines.ndjson")
          go_version=$(go env GOVERSION)
          jq -S -n \
            --arg subject "$SUBJECT_SHA" --arg go_version "$go_version" \
            --argjson regular_files "$regular_files" --argjson descendant_directories "$descendant_directories" \
            --argjson go_files "$go_files" --argjson go_lines "$go_lines" \
            --argjson gooo_files "$gooo_files" --argjson gooo_lines "$gooo_lines" \
            --argjson module_roots "$module_roots" \
            --argjson core_wall_ms 0 --argjson projector_wall_ms "$(cat "$WORK_DIR/projector-wall-ms")" --argjson conformer_wall_ms "$(cat "$WORK_DIR/conformer-wall-ms")" \
            --argjson core_peak_rss_kib "$(cat "$WORK_DIR/core-rss-kib")" --argjson projector_peak_rss_kib "$(cat "$WORK_DIR/projector-rss-kib")" --argjson conformer_peak_rss_kib "$(cat "$WORK_DIR/conformer-rss-kib")" \
            '{schema:"gooo/infra-evidence/released-domain-envelope-v2-adoption-runtime/v1",subject_sha:$subject,go_setup:"1.27.x",go_version:$go_version,
              inventory:{regular_files:$regular_files,descendant_directories:$descendant_directories,root_readme_excluded:true,module_roots:$module_roots,go_fix_roots:[],go_fix_executed:0,go:{files:$go_files,physical_lines:$go_lines},gooo:{files:$gooo_files,physical_lines:$gooo_lines},per_file_source_lines:"source-lines.ndjson"},
              measurements:{core_wall_ms:$core_wall_ms,projector_wall_ms:$projector_wall_ms,conformer_wall_ms:$conformer_wall_ms,core_peak_rss_kib:$core_peak_rss_kib,projector_peak_rss_kib:$projector_peak_rss_kib,conformer_peak_rss_kib:$conformer_peak_rss_kib},
              authority:{repository_writes:0,local_tests:0,cross_project_required_gates:0,kit_source_checkout:0,conformer_copy:0,terraform_execution_authorized:false,openapi_generation_authorized:false,provider_implementation_authorized:false,deployment_execution_authorized:false},
              utility:{released_adoption_observed:0,released_adoption_total:1,external_utility_observed:0,external_utility_total:1,state:"UNKNOWN",reason:"NO_USER_EVIDENCE_OF_EXTERNAL_UTILITY"}}' > "$WORK_DIR/runtime.json"
          jq --argjson metrics "$(jq '.measurements' "$WORK_DIR/runtime.json")" '.metrics=$metrics | .metrics.go_setup=.go_setup | .metrics.inventory=.inventory' "$WORK_DIR/facts.json" > "$WORK_DIR/facts-with-runtime.json"
          mv "$WORK_DIR/facts-with-runtime.json" "$WORK_DIR/facts.json"
          bash scripts/evaluate-released-domain-envelope-v2.sh "$GITHUB_WORKSPACE" contracts/released-domain-envelope-v2-adoption-denominator-v1.json "$WORK_DIR/core-receipts.json" "$WORK_DIR/facts.json" \
            "$WORK_DIR/bundle-a" "$WORK_DIR/conformance.json" "$WORK_DIR/normal.json" normal
          jq -e --arg subject "$SUBJECT_SHA" --argjson cells "$(jq '.target_cells' contracts/released-domain-envelope-v2-adoption-denominator-v1.json)" \
            '.subject_sha==$subject and .decision=="ADOPTION_CANDIDATE_CONFORMANT" and .claim.state=="CLOSED" and .summary.total==$cells and .summary.closed==$cells and .summary.unknown==0 and .summary.refuted==0 and .summary.relations_observed==8 and .summary.evidence_observed==8 and .summary.resolutions_observed==8 and .summary.envelope_files==8 and .summary.kit_checks==10 and .summary.kit_checks_total==10 and .summary.source_replay==1 and .summary.file_replay==8 and (.proofs|map(select(.closed==.total and .total==4))|length)==3 and (.indicator_classes|map(select(.closed==.total and .total==4))|length)==3' "$WORK_DIR/normal.json" >/dev/null
          snapshot() {
            find . -path './.git' -prune -o -type f ! -path './README.md' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          snapshot > "$WORK_DIR/repository-after.sha256"
          cmp "$WORK_DIR/repository-before.sha256" "$WORK_DIR/repository-after.sha256"
          jq -e '.authority.repository_writes==0 and .authority.local_tests==0 and .authority.cross_project_required_gates==0 and .authority.kit_source_checkout==0 and .authority.conformer_copy==0 and .utility.state=="UNKNOWN"' "$WORK_DIR/facts.json" >/dev/null

      - name: Publish evidence artifacts and CI target summary
        uses: actions/upload-artifact@v6
        with:
          name: released-domain-envelope-v2-${{ env.SUBJECT_SHA }}
          if-no-files-found: error
          path: |
            ${{ env.WORK_DIR }}/bundle-a
            ${{ env.WORK_DIR }}/bundle-b
            ${{ env.WORK_DIR }}/conformance.json
            ${{ env.WORK_DIR }}/file-replay.json
            ${{ env.WORK_DIR }}/facts.json
            ${{ env.WORK_DIR }}/normal.json
            ${{ env.WORK_DIR }}/unknown-missing.json
            ${{ env.WORK_DIR }}/unknown-core.json
            ${{ env.WORK_DIR }}/refuted-malformed-unknown.json
            ${{ env.WORK_DIR }}/refuted-fixed-point.json
            ${{ env.WORK_DIR }}/runtime.json
            ${{ env.WORK_DIR }}/source-lines.ndjson
            ${{ env.WORK_DIR }}/infra/deployment-plan.json
            ${{ env.WORK_DIR }}/infra/semantic-deployment-plan-replay.json

      - name: Write CI target summary
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Released-domain envelope v2 adoption candidate

          - subject/check-out: $SUBJECT_SHA / $SUBJECT_SHA
          - product projection: 1/1; envelope files: 8/8
          - relations/evidence/resolutions: 8/8/8
          - kit conformer: 10/10; source replay: 1/1; file replay: 8/8
          - normal/UNKNOWN/REFUTED paths: 1/2/2 (minimum 1/2/1)
          - UNKNOWN coordinates: 6; meta cells: 12/12; proof: 4/4/4; indicator: 4/4/4
          - released adoption: 0/1 UNKNOWN; external utility: 0/1 UNKNOWN
          - repository writes/local tests/cross-project gates: 0/0/0
          - kit source checkout/conformer copy: 0/0
          - Go setup: 1.27.x; root README: excluded; go fix roots: []
          - merge/release: not performed
          EOF
